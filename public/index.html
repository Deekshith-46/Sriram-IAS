<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anubhuti II - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 450px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #c33;
        }

        .success-section {
            text-align: center;
            display: none;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #4CAF50;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .success-section h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .success-section p {
            color: #666;
            margin-bottom: 25px;
        }

        .download-btn {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            margin-bottom: 15px;
        }

        .download-btn:hover {
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
        }

        .user-info {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
        }

        .user-info p {
            margin: 5px 0;
            color: #666;
            font-size: 14px;
        }

        .user-info strong {
            color: #333;
        }

        .back-btn {
            background: #f0f0f0;
            color: #666;
        }

        .back-btn:hover {
            background: #e0e0e0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div id="loginForm">
            <div class="logo">
                <h1>ANUBHUTI II</h1>
                <p>Examination Portal</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <form id="loginFormElement">
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        placeholder="Enter your phone number"
                        required
                        pattern="[0-9]{10}"
                        title="Please enter a valid 10-digit phone number"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email address"
                        required
                    >
                </div>

                <button type="submit" class="btn" id="loginBtn">
                    Login
                </button>
            </form>
        </div>

        <!-- Success Section with Download Button -->
        <div class="success-section" id="successSection">
            <div class="success-icon">✓</div>
            <h2>Login Successful!</h2>
            <p id="welcomeMessage">Welcome!</p>

            <div class="user-info" id="userInfo">
                <!-- User info will be populated here -->
            </div>

            <button class="btn download-btn" id="downloadBtn">
                📥 Download Admit Card
            </button>

            <button class="btn back-btn" onclick="location.reload()">
                ← Back to Login
            </button>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5000';
        
        const loginForm = document.getElementById('loginForm');
        const successSection = document.getElementById('successSection');
        const loginFormElement = document.getElementById('loginFormElement');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const userInfo = document.getElementById('userInfo');
        const welcomeMessage = document.getElementById('welcomeMessage');

        let currentUser = null;

        // Handle login form submission
        loginFormElement.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();

            // Validate inputs
            if (!phone || !email) {
                showError('Please enter both phone number and email');
                return;
            }

            // Show loading state
            setLoading(true);
            hideError();

            try {
                // Verify credentials with backend
                const response = await fetch(`${API_BASE_URL}/auth/verify-login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ phone, email })
                });

                const data = await response.json();

                if (response.ok) {
                    // Login successful
                    currentUser = data.user;
                    showSuccess(data);
                } else {
                    // Login failed
                    showError(data.message || 'Login failed. Please check your credentials.');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Network error. Please make sure the server is running.');
            } finally {
                setLoading(false);
            }
        });

        // Handle download button click
        downloadBtn.addEventListener('click', () => {
            if (currentUser && currentUser.email) {
                // Open admit card download URL
                window.open(`${API_BASE_URL}/admit/download?email=${encodeURIComponent(currentUser.email)}`, '_blank');
            }
        });

        // Show success section
        function showSuccess(data) {
            loginForm.style.display = 'none';
            successSection.style.display = 'block';

            welcomeMessage.textContent = `Welcome, ${data.user.name}!`;
            
            userInfo.innerHTML = `
                <p><strong>Name:</strong> ${data.user.name}</p>
                <p><strong>Email:</strong> ${data.user.email}</p>
                <p><strong>Phone:</strong> ${data.user.phone}</p>
            `;
        }

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                hideError();
            }, 5000);
        }

        // Hide error message
        function hideError() {
            errorMessage.style.display = 'none';
        }

        // Set loading state
        function setLoading(isLoading) {
            if (isLoading) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="loading"></span>Verifying...';
            } else {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        }
    </script>
</body>
</html>
